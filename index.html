<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>I love you paru 🥰</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg1:#FFDEE9;--bg2:#B5FFFC}
    html,body{height:100%;margin:0}
    body{
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;
      color:#fff;text-align:center;padding:24px;
    }
    .card{background:rgba(255,255,255,0.08);padding:40px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.12);backdrop-filter: blur(6px)}
    h1{font-size:48px;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:12px;justify-content:center}
    p{margin:0;font-size:20px;opacity:0.95}
    .heart{width:86px;height:86px;display:inline-block}
    /* animated SVG heart */
    .pulse{animation:pulse 1s infinite}
    @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
    .credits{margin-top:14px;font-size:12px;opacity:0.9}
  </style>
</head>
<body>
  <div class="card">
    <h1>
      <svg class="heart pulse" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img">
        <path fill="#FF6B81" d="M12 21s-7.5-4.86-9.5-8.07C-0.5 8.5 4 4 7.5 6.5 9.5 8 12 10.5 12 10.5s2.5-2.5 4.5-4c3.5-2.5 8 2 4.5 6.43C19.5 16.14 12 21 12 21z"/>
      </svg>
      I love you paru 🥰
    </h1>
    <p>Tu meri khushi ho — bas yahi batana tha 💖</p>
    <div class="credits">Open this page and it will show up nicely — sent with love ❤️</div>
  </div>
</body>
</html>
